<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Notes</title>
<meta name="theme-color" content="#f7faf9">
<meta name="description" content="Plain-text notes that sync with a private GitHub repo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<script>try{var r=document.documentElement,P=JSON.parse(localStorage.getItem('prefs')||'{}'),T=JSON.parse(localStorage.getItem('tv')||'null'),th=P.theme||'auto';if(th!=='auto')r.dataset.theme=th;var m=th==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):th;if(T&&T[m]){T[m].split(';').forEach(function(x){var i=x.indexOf(':');r.style.setProperty(x.slice(0,i),x.slice(i+1))});r.style.colorScheme=m==='light'?'light':'dark'}(P.hide||[]).forEach(function(k){r.classList.add('hide-'+k)})}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="js/app.js"><link rel="modulepreload" href="js/model.js"><link rel="modulepreload" href="js/sync.js"><link rel="modulepreload" href="js/util.js"><link rel="modulepreload" href="js/dom.js"><link rel="modulepreload" href="js/db.js"><link rel="modulepreload" href="js/icons.js"><link rel="modulepreload" href="js/dialogs.js"><link rel="modulepreload" href="js/theme.js"><link rel="modulepreload" href="js/settings.js"><link rel="modulepreload" href="js/preview.js"><link rel="modulepreload" href="js/media.js"><link rel="modulepreload" href="js/ripple.js"><link rel="modulepreload" href="js/editor-tools.js">
</head>
<body>
<!-- Logo: colours follow the accent setting -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="logo" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" style="fill:var(--primary)"/>
      <path d="M158 104h146l74 74v210a24 24 0 0 1-24 24H158a24 24 0 0 1-24-24V128a24 24 0 0 1 24-24z" fill="#fff"/>
      <path d="M304 104v52a24 24 0 0 0 24 24h50z" style="fill:var(--primary-container)"/>
      <rect x="176" y="224" width="160" height="16" rx="8" style="fill:var(--primary)"/>
      <rect x="176" y="272" width="160" height="16" rx="8" style="fill:var(--primary-container)"/>
      <rect x="176" y="320" width="104" height="16" rx="8" style="fill:var(--primary-container)"/>
    </symbol>
  </defs>
</svg>

<div id="app">
  <aside id="side" aria-label="Notes list">
    <header class="side-head">
      <h1>Notes</h1>
      <div class="side-actions">
        <button id="btnFolder" class="icon" title="New folder" aria-label="New folder"></button>
        <button id="btnUpload" class="icon" title="Upload files" aria-label="Upload files"></button>
        <button id="btnSettings" class="icon" title="Settings" aria-label="Settings"></button>
      </div>
    </header>
    <div class="search"><span id="searchIcon"></span><input id="q" type="search" placeholder="Search notes" autocomplete="off" aria-label="Search notes"></div>
    <div id="ptr" aria-hidden="true"></div>
    <nav id="tree" aria-label="Notes"></nav>
    <button id="btnNote" class="fab" title="New note" aria-label="New note"></button>
    <footer id="foot">
      <div id="status" role="button" tabindex="0" title="Sync now"><i class="dot"></i><span></span></div>
      <button id="btnSync" class="icon" title="Sync now (Ctrl+S)" aria-label="Sync now"></button>
    </footer>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <div id="topbar">
      <div class="tb-l">
        <button id="btnMenu" class="icon" title="Notes list" aria-label="Show or hide the notes list"></button>
        <button id="btnSync2" class="icon" title="Sync now" aria-label="Sync now"></button>
      </div>
      <div class="tb-c">
        <input id="title" spellcheck="false" autocomplete="off" placeholder="Untitled" aria-label="Note title">
        <div class="sub"><span id="crumb"></span><span id="stats"></span></div>
      </div>
      <div class="tb-r">
        <div id="modes" class="seg"></div>
        <button id="btnPin" class="icon" title="Pin" aria-label="Pin"></button>
        <button id="btnMore" class="icon" title="More" aria-label="More actions"></button>
      </div>
      <div id="progress"></div>
    </div>
    <div id="doc">
      <div id="pane" data-mode="edit">
        <textarea id="ed" spellcheck="true" placeholder="Start writing…" aria-label="Note text"></textarea>
        <article id="preview" class="md"></article>
        <div id="viewer"></div>
      </div>
      <div id="toolbar"></div>
    </div>
    <div id="empty">
      <div class="empty-card">
        <svg class="logo big" width="72" height="72" aria-hidden="true"><use href="#logo"/></svg>
        <h2>Your notes</h2>
        <p id="emptyMsg">Pick a note from the list, or start a new one.</p>
        <div class="row-btns"><button id="emptyNew" class="primary"></button><button id="emptyList" class="tonal">Browse notes</button><button id="emptyConnect" class="text">Connect GitHub</button></div>
      </div>
    </div>
  </main>
</div>
<div id="menu" role="menu"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="filePick" multiple hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
