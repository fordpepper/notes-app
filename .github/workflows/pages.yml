name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (only runtime files; tests/ and docs stay out)
        run: |
          mkdir _site
          cp -r index.html style.css sw.js manifest.webmanifest js vendor icons _site/
          sed -i "s/__BUILD__/${GITHUB_SHA::10}/" _site/sw.js
          grep -q "${GITHUB_SHA::10}" _site/sw.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: d
        uses: actions/deploy-pages@v4
